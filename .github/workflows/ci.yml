name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-access-extension
          path: dist/

      - name: Создать ZIP для выпуска
        if: github.event_name == 'release'
        run: cd dist && zip -r ../ozon-access-${{ github.event.release.tag_name }}.zip .
      - name: Добавить ZIP в GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "ozon-access-${{ github.event.release.tag_name }}.zip"
