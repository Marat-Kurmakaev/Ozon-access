name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Проверки и сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Собрать расширение
        run: npm run build
      - name: Установить Chromium для Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Загрузить собранное расширение
        uses: actions/upload-artifact@v4
        with:
          name: OzonAccess-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Архив GitHub Release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачать проверенную сборку
        uses: actions/download-artifact@v4
        with:
          name: OzonAccess-dist-${{ github.sha }}
          path: dist
      - name: Проверить тег и manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f dist/manifest.json
      - name: Создать ZIP
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          zip -r "../OzonAccess-${RELEASE_TAG}.zip" .
      - name: Добавить ZIP в GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "OzonAccess-${RELEASE_TAG}.zip" --clobber
