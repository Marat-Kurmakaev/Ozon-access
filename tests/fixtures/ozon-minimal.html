<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>OzonAccess — обезличенный fixture</title>
  </head>
  <body>
    <header>
      <div data-widget="searchBarDesktop">
        <div>
          <div>
            <input type="text" name="text" placeholder="Искать на Ozon">
            <span><button type="button"><svg aria-hidden="true"><path d="image-search"></path></svg></button></span>
          </div>
          <button type="submit"><svg aria-hidden="true"><path d="search"></path></svg></button>
        </div>
      </div>
      <nav data-widget="horizontalMenu"><a href="/category/example/">Категория</a></nav>
      <div data-widget="profileMenuAnonymous" tabindex="0">
        <div class="fixture-profile-handler">
          <div class="fixture-profile-icon"><svg aria-hidden="true"><path d="profile"></path></svg></div>
          <span>Войти</span>
        </div>
      </div>
    </header>
    <div data-widget="wallpaper">
      <section class="fixture-content">
        <div data-widget="tileGridDesktop">
          <article>
            <a href="/product/example-a-100/">
              <img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
              <button><svg><path d="M8.293 3.293a1 1 0 1 1 1.414 1.414L6.414 8l3.293 3.293a1 1 0 1 1-1.414 1.414l-4-4a1 1 0 0 1 0-1.414z"></path></svg></button>
              <button><svg><path d="M6.293 3.293a1 1 0 0 1 1.414 0l4 4a1 1 0 0 1 0 1.414l-4 4a1 1 0 1 1-1.414-1.414L9.586 8 6.293 4.707a1 1 0 0 1 0-1.414"></path></svg></button>
            </a>
            <a href="/product/example-a-100/"><span>Тестовый товар A</span></a>
          </article>
          <article>
            <a href="/product/example-b-200/">
              <img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
              <button><svg><path d="M8.293 3.293a1 1 0 1 1 1.414 1.414L6.414 8l3.293 3.293a1 1 0 1 1-1.414 1.414l-4-4a1 1 0 0 1 0-1.414z"></path></svg></button>
              <button><svg><path d="M6.293 3.293a1 1 0 0 1 1.414 0l4 4a1 1 0 0 1 0 1.414l-4 4a1 1 0 1 1-1.414-1.414L9.586 8 6.293 4.707a1 1 0 0 1 0-1.414"></path></svg></button>
            </a>
            <a href="/product/example-b-200/"><span>Тестовый товар B</span></a>
          </article>
        </div>
      </section>
    </div>
    <footer>Обезличенный тестовый footer</footer>
  </body>
</html>
